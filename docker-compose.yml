services:
  postgres:
    image: postgres:16-alpine
    container_name: phantom_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-phantom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phantom_secret}
      POSTGRES_DB: ${POSTGRES_DB:-phantom_x_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-phantom} -d ${POSTGRES_DB:-phantom_x_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: phantom_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: phantom_backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-phantom}:${POSTGRES_PASSWORD:-phantom_secret}@postgres:5432/${POSTGRES_DB:-phantom_x_db}
      - DATABASE_URL_SYNC=postgresql+psycopg2://${POSTGRES_USER:-phantom}:${POSTGRES_PASSWORD:-phantom_secret}@postgres:5432/${POSTGRES_DB:-phantom_x_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-to-a-secure-random-secret-in-production}
      - EXECUTION_MODE=OBSERVE
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./ai-engine:/app/ai-engine
      - ./security-engine:/app/security-engine
      - ./shared:/app/shared
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
    container_name: phantom_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
      - VITE_WS_BASE_URL=ws://localhost:8000/api/v1/ws
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:

